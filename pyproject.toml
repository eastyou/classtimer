[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "classtimer"
version = "0.1.0"
description = "课堂倒计时：生成可全屏使用、带预设时间的单文件页面"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "teacher", "timer", "classroom", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
classtimer = "classtimer.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/classtimer"
Source = "https://github.com/eastyou/classtimer"

[tool.setuptools]
packages = ["classtimer"]
